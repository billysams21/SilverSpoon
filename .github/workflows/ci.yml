name: CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # test_extraction.py needs a Linux 7-Zip (the repo's 7z.exe is Windows-only).
      - name: Install 7-Zip
        run: command -v 7z || (sudo apt-get update && sudo apt-get install -y 7zip)
      - name: Install Python dependencies
        run: pip install -r requirements-web.txt
      - name: Compile all
        run: python -m compileall -q .
      - name: Run headless tests
        shell: bash
        run: |
          shopt -s nullglob
          for t in test_*.py; do
            echo "== $t =="
            python "$t" || exit 1
          done

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the web image
        run: docker build -t silverspoon-web .
